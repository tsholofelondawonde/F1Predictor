name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ingest season 2024
        2. Rebuild features
        3. ...
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: e.g. ingestion, feature engineering, model training, championship forecast, frontend
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK version, Node version, database (local Postgres / Neon / other).
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
