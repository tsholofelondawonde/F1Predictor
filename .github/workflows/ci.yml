name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify trained models are present
        run: |
          for f in F1Predictor.WebApi/models/podium-model.zip F1Predictor.WebApi/models/points-model.zip; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty $f — the Dockerfile bakes this into the production image; commit the trained model before merging." >&2
              exit 1
            fi
          done

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore F1Predictor.slnx

      - name: Build
        run: dotnet build F1Predictor.slnx --configuration Release --no-restore

      # Uncomment when test projects are added under /tests/
      # - name: Test
      #   run: dotnet test F1Predictor.slnx --configuration Release --no-build --verbosity normal
