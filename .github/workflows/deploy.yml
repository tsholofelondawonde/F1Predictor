name: Deploy

# Maintainer's reference deployment to Azure Container Apps. A fork wires this to its own
# cloud by setting the repository VARIABLES read below (Settings → Secrets and variables →
# Actions → Variables) plus the AZURE_* secrets, and changing the `github.repository` guard
# on the deploy job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deploy must not race another deploy: the container app runs in Single revision mode, so
# two overlapping image swaps would fight over which revision ends up active. Queue instead
# of cancelling — a cancelled run would leave the registry with a pushed but undeployed tag.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP: ${{ vars.CONTAINER_APP }}
  APP_URL: ${{ vars.APP_URL }}

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore F1Predictor.slnx

      - name: Build
        run: dotnet build F1Predictor.slnx --configuration Release --no-restore

  deploy:
    name: Deploy to Azure Container Apps
    needs: build
    # Only the upstream repo deploys. Forks: change this to your own slug (and set the
    # variables/secrets above) to enable it.
    if: github.repository == 'tsholofelondawonde/F1Predictor'
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # mint the OIDC token azure/login exchanges for an Azure AD token
      contents: read

    environment:
      name: azure-production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Federated credentials, so there is no client secret to store or rotate. The app
      # registration trusts two subjects: this repo's main branch, and its `azure-production`
      # environment — declaring `environment:` above changes the token's sub claim to the
      # latter, so that is the one this job actually presents.
      #
      # Both trusted subjects carry GitHub's IMMUTABLE form, with the numeric owner and repo
      # IDs embedded: `repo:<owner>@<ownerId>/<repo>@<repoId>:environment:azure-production`.
      # GitHub issues the sub claim that way here regardless of the repo's OIDC customization
      # setting; a credential registered with the older `repo:<owner>/<repo>:...` form is not
      # matched and login fails with AADSTS700213.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The registry has its admin user disabled, so this exchanges the Azure AD token for a
      # refresh token rather than using a username and password.
      - name: Sign in to the container registry
        run: az acr login --name "$REGISTRY_NAME"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Context is the repo root, not the Dockerfile's directory: central package management
      # puts Directory.Build.props and Directory.Packages.props there, and a restore without
      # them fails. .dockerignore keeps the upload small.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: F1Predictor.WebApi/Dockerfile
          # Stamps the commit into the image so /health can name it back — see the Dockerfile.
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Recorded BEFORE the update below — that is the last moment the image the app is currently
      # serving can still be read off it. The rollback step re-deploys exactly this.
      - name: Capture the live image
        id: current
        run: |
          previous=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)
          echo "Currently deployed: ${previous:-<none>}"
          echo "image=$previous" >> "$GITHUB_OUTPUT"

      # Deployed by immutable SHA tag, never by :latest. Re-pointing the app at a tag it is
      # already on does not reliably create a revision, and a moving tag makes "which commit
      # is live" unanswerable and a rollback guesswork. :latest is pushed as a pointer only.
      - name: Deploy the new revision
        id: deploy
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            --output none

      # The script polls rather than curling once (minReplicas is 0, so the swap cold-starts a
      # replica) and asserts the commit rather than just the status — see its header for why a
      # Healthy /health is not on its own evidence that this build is the one serving.
      - name: Smoke test /health
        id: smoke
        run: bash .github/scripts/wait-for-health.sh "${{ github.sha }}"

      # The container app runs in Single revision mode, so by the time the smoke test runs the new
      # revision already holds 100% of traffic: a failure above is a live outage, not a pending
      # one. Put the previous image back and verify that too.
      #
      # Note this creates a THIRD revision from the old image — a fresh cold start, not a
      # reactivation of the old revision. So a failure that was environmental rather than in the
      # image (Neon unreachable, a bad Security__ApiKey) will reproduce on the rollback, which is
      # exactly why its own health poll has to be checked before claiming anything was fixed.
      #
      # Scoped to a failure at or after the update: a bare `failure()` would also fire for a failed
      # checkout, login or image build, where nothing was deployed and a "rollback" would only
      # churn a pointless revision on an app nobody touched.
      - name: Roll back to the previous image
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          PREVIOUS_IMAGE: ${{ steps.current.outputs.image }}
        run: |
          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "::error::No previous image was recorded, so there is nothing to roll back to. ${{ github.sha }} is still live and unverified — recover by hand."
            exit 1
          fi

          previous_tag="${PREVIOUS_IMAGE##*:}"
          if [ "$previous_tag" = "${{ github.sha }}" ]; then
            echo "::error::The app was already on ${{ github.sha }} before this run (a re-run, or a dispatch on unchanged main), so a rollback would be a no-op that silently leaves the failing build live. Deploy a known-good commit instead."
            exit 1
          fi

          echo "Rolling back to $PREVIOUS_IMAGE."
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$PREVIOUS_IMAGE" \
            --output none

          # Only a SHA tag names a build /health can be asserted against; :latest, or an image
          # pushed before the build field existed, has nothing useful to match on.
          expected=""
          if printf '%s' "$previous_tag" | grep -Eq '^[0-9a-f]{40}$'; then
            expected="$previous_tag"
          fi

          if bash .github/scripts/wait-for-health.sh "$expected"; then
            echo "::error::Smoke test failed for ${{ github.sha }}; rolled back to $PREVIOUS_IMAGE and confirmed it healthy. The failing revision held all traffic for the duration of the poll — read the container app logs before retrying."
          else
            echo "::error::Smoke test failed for ${{ github.sha }} AND the rollback to $PREVIOUS_IMAGE did not come back healthy — the API is down. A failure that survives the rollback is usually environmental rather than in the image: check the container app's secrets and the Neon connection before redeploying."
            exit 1
          fi
